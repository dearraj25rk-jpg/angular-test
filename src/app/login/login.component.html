<div class="login-container">
  <form (ngSubmit)="login()" autocomplete="off">
    <h2>{{ buttonLabel }}</h2>
    <div *ngIf="error" class="error">{{ error }}</div>
    <div class="form-group">
      <label for="username">{{ usernameLabel }}</label>
      <input id="username" name="username" [(ngModel)]="username" [disabled]="isLoading" required autofocus />
    </div>
    <div class="form-group">
      <label for="password">{{ passwordLabel }}</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" [disabled]="isLoading" required />
    </div>
    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Loading...' : buttonLabel }}
    </button>
  </form>
</div>
